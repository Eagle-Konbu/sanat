name: Spell Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cspell:
    name: CSpell
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Run cspell
      uses: streetsidesoftware/cspell-action@v7.2.1
      with:
        files: "**/*.{go,md,yml,yaml,toml}"
        check_dot_files: true
