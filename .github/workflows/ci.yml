name: CI

on:
  push:
    branches: [ main, "epic/**" ]
  pull_request:
    branches: [ main, "epic/**" ]

jobs:
  mod-check:
    name: Module Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: "go.mod"

    - name: Download dependencies
      run: go mod download

    - name: Run go mod tidy
      run: go mod tidy

    - name: Verify go.mod is clean
      run: git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: "go.mod"

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race ./...

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: "go.mod"

    - name: Setup Bats
      uses: bats-core/bats-action@4.0.0
      with:
        bats-version: '1.14.0'

    - name: Run e2e tests
      run: bats e2e/

  golangci-plugin:
    name: golangci-lint Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: "go.mod"

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

    - name: Setup Bats
      uses: bats-core/bats-action@4.0.0
      with:
        bats-version: '1.14.0'

    - name: Run golangci-lint plugin smoke tests
      run: bats e2e/golangci/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: "go.mod"

    - name: Download dependencies
      run: go mod download

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.txt ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.4.0

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version-file: "go.mod"

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: latest

    # Only new or changed exported identifiers must be documented, so this
    # runs a separate config on the diff against the PR's base branch (or,
    # on push, the previous head) instead of adding the rule to .golangci.yml.
    - name: Check doc comments on new exported identifiers
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: latest
        args: --config .golangci.exported.yml
        only-new-issues: true
