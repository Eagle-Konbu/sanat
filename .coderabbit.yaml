# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: en-US
early_access: false

# Frame the reviewer's expertise: this repo is an in-house SQL lexer/parser
# and formatter library, so reviews should come from someone fluent in
# relational database/SQL semantics and in designing Go libraries (public
# API surface, zero-value usability, error handling conventions), not just
# general Go style.
tone_instructions: >
  Review as a senior engineer with deep expertise in relational databases,
  SQL semantics, and Go library API design. Weigh SQL correctness and
  idiomatic, well-encapsulated Go library APIs over style nitpicks.

reviews:
  profile: chill
  request_changes_workflow: true
  poem: true

  auto_review:
    enabled: true
    drafts: true
    # Review PRs against any base branch, not just the default branch.
    base_branches:
      - ".*"
    # Renovate opens automated dependency-bump PRs; blocking review on these
    # adds manual-override friction without much benefit.
    ignore_usernames:
      - renovate[bot]

  # CI already runs golangci-lint via `task lint`; avoid reviewing the same
  # concern twice.
  tools:
    golangci-lint:
      enabled: false

  pre_merge_checks:
    title:
      mode: error
      requirements: >
        Write a concise, descriptive summary of the change in imperative
        mood (e.g. "Add", "Fix", "Refactor"), so a reviewer can understand
        the change at a glance.
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    # The check scores the share of all functions in a PR that have a doc
    # comment, including _test.go functions and AST marker methods, and it
    # cannot be scoped by path. That made it warn on every parser PR even
    # though all exported API is documented. Two guardrails replace it:
    # - CI's "Check doc comments on new exported identifiers" step (and
    #   `task lint:exported`) runs revive's exported rule from
    #   .golangci.exported.yml on the diff, failing on a new or changed
    #   exported identifier without a doc comment.
    # - path_instructions below ask for doc comments that are accurate and
    #   explain "why", and flag new exported identifiers that lack one.
    docstrings:
      mode: "off"

  finishing_touches:
    autofix:
      enabled: true

  path_instructions:
    - path: "**/*.go"
      instructions: >
        Follow this project's Go guidelines (see .ai/instructions.md): prefer
        clarity over cleverness and simplicity over premature optimization;
        code should be self-explanatory through descriptive names and
        straightforward control flow. Comments should explain "why", not
        "what" — flag comments that merely restate the code. Favor idiomatic
        Go (effective Go conventions for error handling, naming, and
        receivers) over non-idiomatic patterns. For doc comments on exported
        identifiers, prioritize whether the explanation is accurate and
        clear over simply being present. Still flag a new or changed
        exported identifier that has no doc comment at all.

        This package implements an in-house SQL lexer/parser and formatter
        (see docs/parser-spec.md, docs/formatter-spec.md), so bring a
        relational-database/SQL specialist's eye to lexer, parser, and AST
        code: check that tokenization and grammar handling match real SQL
        semantics (dialect-specific keywords, operator precedence, quoting
        and escaping rules, comment/whitespace edge cases, multi-statement
        and nested-expression handling) rather than assuming a simplified
        model of SQL. Flag cases where an edge case in the SQL grammar could
        silently produce an incorrect AST or malformed output.

        Also review as a Go library author: public API in exported types,
        functions, and interfaces should be reviewed for a good library
        surface — meaningful zero values, minimal exported surface area,
        stable and composable signatures, errors that are wrapped/typed so
        callers can handle them programmatically (errors.Is/As), and
        avoidance of breaking changes to already-exported APIs. Prefer
        catching these library-design concerns over restating linter-level
        style feedback.
    - path: "internal/sqlfmt/sqlast/**"
      instructions: >
        This package defines the SQL AST using marker methods to seal each
        node interface to types declared in this package. Review new or
        changed node types as a tree-design problem, not just a
        SQL-semantics one: every node must implement the marker method(s)
        for the interface(s) it claims, have a correct String()
        implementation, and use receiver types (value vs. pointer)
        consistently with sibling node types. Check that a new or changed
        node type is exhaustively handled everywhere nodes of its
        interface are switched over elsewhere in the codebase (printer,
        formatter, other visitors) — a missed case is a silent formatting
        bug, not a compile error, since these are interface types. Prefer
        minimal, composable node shapes over reusing an unrelated existing
        node type just to avoid adding a new one.
    - path: "internal/sqlfmt/parser/**"
      instructions: >
        This is a hand-written recursive-descent SQL parser producing the
        sqlast tree (see docs/parser-spec.md). Review precedence and
        associativity changes against real SQL operator precedence, not
        just internal consistency — an error in precedence handling
        silently reorders or misgroups a valid query rather than failing
        loudly. If the codebase parses SQL through more than one path
        (e.g. this parser alongside a third-party parser elsewhere),
        flag behavioral divergence between them for the same construct
        unless the PR explains the divergence is intentional.
    - path: "internal/sqlfmt/pgast/**"
      instructions: >
        This package defines the PostgreSQL AST, mirroring sqlast's shape,
        and uses marker methods (gathered in markers.go) to seal each node
        interface (Statement, Expr, TableExpr, SelectExpr, SimpleTableExpr,
        InsertRows, MergeAction) to types declared in this package. Review
        new or changed node types as a tree-design problem: every node must
        implement the marker method(s) for the interface(s) it claims, have
        a String() that renders valid PostgreSQL (not MySQL) syntax, and use
        receiver types (value vs. pointer) consistently with sibling node
        types. Check that a new or changed node type is handled everywhere
        nodes of its interface are switched over (pgparser, String()
        implementations, and any formatter or visitor) — a missed case is a
        silent formatting bug, not a compile error. Prefer minimal,
        composable node shapes over reusing an unrelated node type, and
        flag a node copied from sqlast that carries MySQL-only semantics.
    - path: "internal/sqlfmt/pgparser/**"
      instructions: >
        This is a hand-written PostgreSQL lexer and recursive-descent parser
        producing the pgast tree (see docs/postgres-parser-spec.md). Review
        precedence and associativity against PostgreSQL's documented
        operator precedence table and gram.y, not just internal consistency
        or MySQL's rules: for example, NOT binds looser than IS, comparison
        operators are non-associative, '^' is left-associative and looser
        than unary minus, '::' binds tighter than unary minus, and any
        operator without its own precedence level shares the generic
        operator level. A precedence error silently misgroups a valid query
        rather than failing loudly. Check lexing against PostgreSQL's
        scanner (scan.l) under standard_conforming_strings = on: no
        backslash escapes in plain '...' strings, E'...' escapes,
        dollar-quoted strings, nested block comments, double-quoted
        identifiers that preserve case while unquoted ones fold to lower
        case, "$n" placeholders, and multi-character operator runs. Check
        that keyword handling follows PostgreSQL's keyword categories
        (unreserved, col_name, type_func_name, reserved) so non-reserved
        keywords still parse as names. This package deliberately mirrors
        internal/sqlfmt/parser's structure, so flag MySQL behavior carried
        over by mistake (backtick quoting, '#' comments, backslash escapes
        in plain strings, MySQL-only syntax) unless the PR explains it.
    - path: "**/*_test.go"
      instructions: >
        Test coverage percentage and lint/formatting issues are already
        enforced by CI (`task test`, `task lint`) — do not comment on
        coverage numbers or style. Focus on whether the test cases
        themselves are appropriate: missing edge cases, redundant or
        overlapping cases, and whether assertions actually validate the
        intended behavior.
    - path: "testdata/**"
      instructions: >
        These are fixture files for the SQL formatter (input/expected
        pairs) and may intentionally contain non-standard or unusual
        formatting on purpose as test input. Do not flag stylistic issues
        inside fixture content itself, but do flag if the set of fixtures
        seems redundant or insufficient to cover realistic formatting
        scenarios.
    - path: "**/*.md"
      instructions: >
        Documentation must be written in English only, per project
        guidelines.
